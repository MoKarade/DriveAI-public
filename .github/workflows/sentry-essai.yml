name: Essai Sentry

# Lancement MANUEL seulement : envoie une erreur volontaire à Sentry avec le secret SENTRY_DSN du
# dépôt et échoue si Sentry ne répond pas par un code 2xx. C'est la preuve que la chaîne
# secret -> code de l'app (api/_sentry.ts : aucune donnée personnelle) -> Sentry fonctionne.
# Aucun déclencheur automatique : rien n'est envoyé à Sentry sans geste.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essai:
    name: Envoyer une erreur d'essai
    runs-on: ${{ (github.event.repository.visibility == 'private' && vars.RUNNER_CI == 'pc') && fromJSON('["self-hosted","pc-marc"]') || 'ubuntu-latest' }} # machines GitHub ; le robot du PC seulement si la variable de dépôt RUNNER_CI vaut « pc » (dépôt privé)
    # Plafond : un job figé tourne six heures avant d'échouer. L'essai dure quelques secondes.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Envoyer l'erreur d'essai
        run: node scripts/sentry-essai.mjs
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
